name: 檢查與建置
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 檢查
        run: python3 framework/tools/check.py
      - name: 建置每個知識庫的手冊網站和簡報
        run: python3 framework/tools/build.py --release-dir out
      - name: 發布到 Release（只在主線更新時）
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          gh release create "$tag" out/*.html --target "$GITHUB_SHA" \
            --title "手冊網站與簡報 ${GITHUB_SHA::7}" --notes "主線更新後自動建置。" --latest
