<title>知識傳承框架互動簡報</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:ital@1&display=swap">
<style>/* ===== 先進製程簡報 · 淺色學術風 =====
   畫布固定 1600×900，由 engine.js 等比例縮放 */
:root {
  color-scheme: light;
  --paper: #fbfcfd;
  --panel: #f2f5f8;
  --panel-2: #e8edf3;
  --line: #d3dbe4;
  --line-strong: #9aa8b8;
  --ink: #17202b;
  --ink-2: #3e4b5b;
  --ink-3: #6a7888;
  --accent: #1f4fb5;        /* 教科書圖藍 */
  --accent-soft: #e3ebfa;
  --accent-2: #b3541e;      /* 銅／警示重點 */
  --accent-2-soft: #f8e9df;
  --good: #1f7a4d;
  --warn: #a8660a;
  --bad: #b3261e;
  /* 材料配色（全場一致） */
  --m-si: #a9bcd0;
  --m-si-dark: #7f97b0;
  --m-ox: #f1e3a8;
  --m-nit: #8fc1b5;
  --m-pr: #e39ac2;
  --m-pr-exp: #f6d3e6;
  --m-poly: #c2a878;
  --m-hk: #9d80d6;
  --m-metal: #7b8794;
  --m-cu: #c9793b;
  --m-sige: #b8c85a;
  --m-ndope: #5b8fd9;
  --m-pdope: #d9765b;
  --m-w: #5e6770;
  --m-ru: #6f86a8;

  --font-sans: "IBM Plex Sans", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  --font-cjk: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  --font-serif: "Source Serif 4", "Songti TC", "Noto Serif TC", Georgia, serif;
  --font-mono: "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: #dfe4ea;
  color: var(--ink);
  font-family: var(--font-sans);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 舞台 ---------- */
#viewport { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1600px; height: 900px;
  transform-origin: 0 0;
  background: var(--paper);
  box-shadow: 0 10px 40px rgba(20, 30, 45, .18);
  overflow: hidden;
}
.slide { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 34px 48px 26px; font-size: 19px; line-height: 1.5; }
.slide.enter { animation: slideIn .28s ease-out; }
@keyframes slideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }

/* ---------- 標題列 ---------- */
.s-head { display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; align-items: end; border-bottom: 1.5px solid var(--ink); padding-bottom: 10px; margin-bottom: 16px; }
.s-eyebrow { font-family: var(--font-mono); font-size: 15px; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; display: flex; gap: 12px; align-items: center; }
.s-eyebrow .num { color: var(--ink-3); }
.s-title { grid-column: 1 / -1; font-size: 36px; line-height: 1.2; font-weight: 700; margin: 2px 0 0; letter-spacing: .01em; }
.s-title .en, .s-title .newtag { display: inline-block; }
.s-title .en { font-weight: 400; color: var(--ink-3); font-size: 24px; margin-left: 10px; }
.s-thesis { grid-column: 1 / -1; font-size: 19px; color: var(--ink-2); margin: 2px 0 0; }
.s-thesis b { color: var(--accent-2); font-weight: 600; }

/* 迷你流程列 */
.miniflow { grid-column: 2; grid-row: 1; align-self: start; display: flex; gap: 3px; font-size: 13.5px; font-family: var(--font-cjk); }
.miniflow span[data-chap]:not(.on) { cursor: pointer; }
.miniflow span[data-chap]:not(.on):hover { background: var(--accent-soft); color: var(--accent); }
.miniflow span { padding: 4px 9px; background: var(--panel); color: var(--ink-3); border-radius: 2px; white-space: nowrap; }
.miniflow span.on { background: var(--accent); color: #fff; font-weight: 600; }
.miniflow span.rel { background: var(--accent-soft); color: var(--accent); }

/* ---------- 版面格線 ---------- */
.s-body { flex: 1; min-height: 0; display: grid; gap: 22px; grid-template-columns: 58fr 42fr; }
.s-body.w50 { grid-template-columns: 1fr 1fr; }
.s-body.w66 { grid-template-columns: 66fr 34fr; }
.s-body.full { grid-template-columns: 1fr; }
.s-body.three { grid-template-columns: repeat(3, 1fr); }
.col { display: flex; flex-direction: column; gap: 14px; min-height: 0; min-width: 0; }
.s-foot { margin-top: 10px; display: flex; justify-content: space-between; gap: 20px; font-size: 14px; color: var(--ink-3); align-items: flex-end; }
.s-foot .src { font-family: var(--font-mono); font-size: 13px; margin-right: 330px; text-align: right; } /* 讓開右下角的翻頁按鈕列 */

/* 主圖面板 */
.fig { position: relative; background: #fff; border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.fig.grow { flex: 1; }
.fig-title { font-size: 15px; font-family: var(--font-mono); letter-spacing: .04em; color: var(--ink-3); display: flex; justify-content: space-between; gap: 12px; }
.fig-canvas { flex: 1; min-height: 0; position: relative; }
.fig-canvas > svg, .fig-canvas > canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.caption { font-size: 15px; color: var(--ink-3); }

/* 重點條列 */
.points { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.points li { position: relative; padding-left: 22px; font-size: 18.5px; line-height: 1.5; }
.points li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 8px; height: 8px; background: var(--accent); }
.points li b { color: var(--ink); }
.points li .k { color: var(--accent-2); font-weight: 600; }
.points.tight li { font-size: 17px; }
.points.num { counter-reset: p; }
.points.num li::before { counter-increment: p; content: counter(p); width: 18px; height: 18px; top: .2em; left: -2px; font-size: 13px; font-family: var(--font-mono); color: #fff; display: grid; place-items: center; border-radius: 50%; }
.points.num li { padding-left: 26px; }

/* 數字／公式卡 */
.card { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 12px 16px; }
.card.key { background: var(--accent-soft); border-color: #bfcfee; }
.card.alt { background: var(--accent-2-soft); border-color: #eccab4; }
.card h4 { margin: 0 0 4px; font-size: 14px; font-family: var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.card .big { font-size: 34px; font-weight: 700; font-family: var(--font-mono); color: var(--accent); line-height: 1.15; font-variant-numeric: tabular-nums; }
.card.alt .big { color: var(--accent-2); }
.card p { margin: 4px 0 0; font-size: 16.5px; color: var(--ink-2); line-height: 1.45; }
.formula { font-family: var(--font-serif); font-size: 30px; font-style: italic; color: var(--ink); letter-spacing: .02em; }
.formula sub, .formula sup { font-size: .6em; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(2, 1fr); }
.cards.c3 { grid-template-columns: repeat(3, 1fr); }

/* 表格 */
table.t { width: 100%; border-collapse: collapse; font-size: 16px; font-variant-numeric: tabular-nums; }
table.t th, table.t td { padding: 6px 9px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.t th { font-size: 14px; font-family: var(--font-mono); letter-spacing: .04em; color: var(--ink-3); font-weight: 500; border-bottom: 1.5px solid var(--ink-2); }
table.t td.n { font-family: var(--font-mono); text-align: right; }
table.t tr.hl td { background: var(--accent-soft); }
table.t tr.clickable { cursor: pointer; }
table.t tr.clickable:hover td { background: var(--panel); }

/* 控制元件 */
.controls { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.ctl { display: flex; flex-direction: column; gap: 2px; min-width: 180px; flex: 1; }
.ctl label { font-size: 15px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; }
.ctl label output { font-family: var(--font-mono); color: var(--accent); font-weight: 600; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 22px; cursor: pointer; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 4px; overflow: hidden; background: #fff; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 15.5px; border: 0; background: transparent; padding: 6px 13px; cursor: pointer; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: #fff; }
.seg button:hover:not(.on) { background: var(--panel); }
.btn { font: inherit; font-size: 15.5px; border: 1px solid var(--line-strong); background: #fff; color: var(--ink); padding: 6px 14px; border-radius: 4px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { background: var(--panel); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: #193f93; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stepper { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepper .dots { display: flex; gap: 4px; }
.stepper .dots i { width: 36px; height: 14px; background: var(--line); border-radius: 3px; cursor: pointer; }
.stepper .dots i.on { background: var(--accent); }
.stepper .dots i.done { background: #9fb5e3; }
.step-text { font-size: 17px; color: var(--ink-2); min-height: 52px; line-height: 1.45; }
.step-text b { color: var(--accent); }

/* 標籤 */
.tag { display: inline-block; font-size: 13.5px; font-family: var(--font-mono); padding: 1px 7px; border-radius: 2px; background: var(--panel-2); color: var(--ink-2); vertical-align: 2px; }
.tag.g { background: #dcefe4; color: var(--good); }
.tag.w { background: #f7ead3; color: var(--warn); }
.tag.b { background: #f6dcda; color: var(--bad); }
.tag.a { background: var(--accent-soft); color: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 13px; height: 13px; margin-right: 5px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.18); }

/* SVG 共用 */
svg text { font-family: var(--font-sans); fill: var(--ink-2); }
svg .axis line, svg .axis path { stroke: var(--line-strong); }
svg .grid line { stroke: var(--line); stroke-dasharray: 2 3; }
svg .lbl { font-size: 14px; fill: var(--ink-2); }
svg .lbl-s { font-size: 12.5px; fill: var(--ink-3); }
svg .mono { font-family: var(--font-mono); }
svg .hot { cursor: pointer; }
svg .hot:hover { filter: brightness(.94); }

/* ---------- 封面 / 章節頁 ---------- */
.cover { padding: 0; }
.cover-grid { display: grid; grid-template-columns: 1.05fr .95fr; height: 100%; }
.cover-left { padding: 70px 64px; display: flex; flex-direction: column; justify-content: space-between; }
.cover-right { background: var(--panel); position: relative; border-left: 1px solid var(--line); }
.cover h1 { font-size: 64px; line-height: 1.15; margin: 18px 0 18px; font-weight: 700; letter-spacing: .01em; }
.cover .sub { font-size: 24px; color: var(--ink-2); line-height: 1.5; }
.cover .meta { font-family: var(--font-mono); font-size: 15px; color: var(--ink-3); line-height: 1.8; }

.divider-slide { padding: 0; }
.divider-grid { display: grid; grid-template-columns: 420px 1fr; height: 100%; }
.divider-num { background: var(--accent); color: #fff; display: flex; flex-direction: column; justify-content: flex-end; padding: 56px; }
.divider-num .n { font-family: var(--font-mono); font-size: 140px; line-height: 1; font-weight: 300; }
.divider-num .l { font-family: var(--font-mono); letter-spacing: .12em; font-size: 16px; text-transform: uppercase; opacity: .85; }
.divider-body { padding: 70px 64px; display: flex; flex-direction: column; gap: 22px; }
.divider-body h2 { font-size: 50px; margin: 0; line-height: 1.2; }
.divider-body .q { font-size: 23px; color: var(--ink-2); max-width: 900px; }

/* ---------- 講者備註 / 總覽 / 進度 ---------- */
#progress { position: fixed; left: 0; bottom: 0; height: 4px; background: var(--accent); transition: width .25s; z-index: 30; }
#hud { position: fixed; right: 12px; bottom: 10px; font-family: var(--font-mono); font-size: 12.5px; color: #5b6878; z-index: 31; display: flex; gap: 8px; align-items: center; }
#hud button { font: inherit; border: 1px solid #b8c3cf; background: rgba(255,255,255,.85); color: #3e4b5b; padding: 3px 8px; border-radius: 3px; cursor: pointer; }
#hud button:hover { background: #fff; }
#notes { position: fixed; left: 0; right: 0; bottom: 0; max-height: 42vh; background: #1b2430; color: #e9eef4; z-index: 40; padding: 16px 28px 22px; overflow: auto; font-size: 17px; line-height: 1.65; box-shadow: 0 -6px 30px rgba(0,0,0,.25); }
#notes .nh { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 13px; color: #9fb0c4; margin-bottom: 8px; gap: 16px; flex-wrap: wrap; }
#notes .nh b { color: #ffd28a; font-weight: 500; }
#notes .tg { color: #ffd28a; }
#notes p { margin: 0 0 8px; max-width: 1200px; }
#overview { position: fixed; inset: 0; background: rgba(233,237,242,.97); z-index: 50; overflow: auto; padding: 28px 36px 60px; }
#overview h3 { font-family: var(--font-mono); font-size: 14px; letter-spacing: .08em; color: var(--accent); margin: 18px 0 8px; text-transform: uppercase; }
#overview .og { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
#overview .oc { background: #fff; border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; cursor: pointer; font-size: 14.5px; display: grid; grid-template-columns: 30px 1fr auto; gap: 6px; align-items: baseline; }
#overview .oc:hover { border-color: var(--accent); }
#overview .oc.cur { outline: 2px solid var(--accent); }
#overview .oc .i { font-family: var(--font-mono); color: var(--ink-3); font-size: 12.5px; }
#overview .oc .m { font-family: var(--font-mono); color: var(--ink-3); font-size: 12px; }
#overview .ot { font-size: 14px; color: var(--ink-2); margin-bottom: 6px; font-family: var(--font-mono); }
#help { position: fixed; left: 12px; bottom: 10px; font-family: var(--font-mono); font-size: 12px; color: #6a7888; z-index: 31; }

/* ---------- 簡單版元件：比喻卡、量條、一句話數字 ---------- */
.points.simple li { font-size: 21px; line-height: 1.45; }
.analogy { display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; background: var(--accent-2-soft); border: 1px solid #eccab4; border-radius: 6px; padding: 14px 16px; }
.analogy .ic { width: 64px; height: 64px; border-radius: 50%; background: #fff; display: grid; place-items: center; border: 1px solid #eccab4; }
.analogy .ic svg { width: 40px; height: 40px; }
.analogy h4 { margin: 0 0 2px; font-size: 14px; font-family: var(--font-mono); letter-spacing: .08em; color: var(--accent-2); font-weight: 500; }
.analogy p { margin: 0; font-size: 20px; line-height: 1.45; color: var(--ink); }
.fact { border-left: 4px solid var(--accent); padding: 6px 0 6px 14px; }
.fact .v { font-size: 34px; font-weight: 700; color: var(--accent); line-height: 1.15; font-variant-numeric: tabular-nums; }
.fact .d { font-size: 18px; color: var(--ink-2); }
.meter { display: grid; grid-template-columns: 110px 1fr 70px; gap: 10px; align-items: center; font-size: 16px; color: var(--ink-2); }
.meter .bar { height: 16px; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 8px; transition: width .25s, background .25s; }
.meter .bar i.bad { background: var(--bad); }
.meter .bar i.warn { background: var(--warn); }
.meter .bar i.good { background: var(--good); }
.meter .val { font-family: var(--font-mono); text-align: right; color: var(--ink); }
.meters { display: flex; flex-direction: column; gap: 8px; }
.gloss { font-size: 15px; color: var(--ink-3); }
.gloss b { color: var(--accent); font-weight: 600; }
.bigword { font-size: 26px; font-weight: 700; line-height: 1.3; text-wrap: balance; }

/* 跳頁後的返回按鈕 */
.backbtn { white-space: nowrap; font-family: var(--font-cjk); font-size: 14px; letter-spacing: 0; text-transform: none; padding: 2px 12px; margin-left: 8px; border-radius: 16px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); cursor: pointer; box-shadow: 0 2px 8px rgba(31,79,181,.15); }
.backbtn:hover { background: var(--accent); color: #fff; }
.backbtn.float { position: absolute; left: 48px; bottom: 8px; z-index: 5; font-size: 15px; padding: 5px 14px; }
.sc-row.primary span { color: #fff !important; }
.hubbtn { border-color: var(--accent-2); background: var(--accent-2-soft); color: var(--accent-2); }
.hubbtn:hover { background: var(--accent-2); color: #fff; }
.go-card { font: inherit; text-align: left; cursor: pointer; }
.go-card:hover { border-color: var(--accent); background: var(--accent-soft); }
.go-card h4 { color: var(--accent); }

/* 標題旁的「新技術」標籤 */
.newtag { display: inline-block; margin-left: 12px; padding: 3px 12px; font-size: 17px; font-weight: 700; letter-spacing: .04em; border-radius: 14px; background: var(--accent-2); color: #fff; vertical-align: 6px; font-family: var(--font-cjk); }
.newcard { border-left: 4px solid var(--accent-2); background: #fdf3ea; }
.newcard h4 { color: var(--accent-2); }
.newcard p { font-size: 17.5px; margin: 2px 0 6px; line-height: 1.45; }

/* 全螢幕醒目游標 */
#ptr-halo { position: fixed; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none; z-index: 9999;
  background: radial-gradient(circle, rgba(255,60,40,.55) 0 28%, rgba(255,60,40,.25) 52%, rgba(255,60,40,0) 72%);
  box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 0 14px 4px rgba(255,60,40,.45); opacity: 0; transition: opacity .25s; will-change: transform; }
#ptr-halo.on { opacity: 1; }
#ptr-halo.on.idle { opacity: 0; transition: opacity .8s; }
.ptr-ripple { position: fixed; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; border: 3px solid rgba(255,60,40,.9); pointer-events: none; z-index: 9999; animation: ptr-rip .6s ease-out forwards; }
@keyframes ptr-rip { from { transform: scale(1); opacity: 1; } to { transform: scale(4); opacity: 0; } }

/* OCD 補充頁：小地圖＋右欄「目的／原因／做法」 */
.minimap { display: flex; align-items: center; gap: 6px; font-size: 15px; }
.minimap .nd { padding: 3px 14px; border-radius: 14px; background: var(--panel); color: var(--ink-3); border: 1px solid var(--line); }
.minimap .nd.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.minimap .ar { color: var(--line-strong); display: inline-flex; align-items: center; gap: 2px; font-weight: 700; }
.minimap .ar small { font-size: 14px; font-weight: 600; }
.minimap .ar.on { color: var(--accent-2); }
.ppw { gap: 10px; }
.card.pp { padding: 10px 16px; border-left: 5px solid var(--line-strong); background: #fff; transition: border-color .25s, background .25s; }
.card.pp h4 { font-family: var(--font-cjk); font-size: 15px; letter-spacing: .1em; color: var(--ink-3); font-weight: 700; }
.card.pp p { font-size: 18px; color: var(--ink); line-height: 1.45; }
.card.pp.on { border-left-color: var(--accent-2); background: var(--accent-2-soft); }
.card.pp.how { border-left-color: var(--accent); }
.how ol { margin: 4px 0 0; padding: 0; list-style: none; counter-reset: h; display: flex; flex-direction: column; gap: 6px; }
.how li { counter-increment: h; position: relative; padding: 5px 8px 5px 34px; border-radius: 4px; font-size: 17.5px; line-height: 1.4; color: var(--ink-2); transition: background .25s, color .25s; }
.how li::before { content: counter(h); position: absolute; left: 6px; top: 6px; width: 20px; height: 20px; border-radius: 50%; background: var(--panel-2); color: var(--ink-3); font: 600 13px var(--font-mono); display: grid; place-items: center; }
.how li.on { background: var(--accent-soft); color: var(--ink); }
.how li.on::before { background: var(--accent); color: #fff; }
.controls.guided { visibility: hidden; }
.controls.guided.live { visibility: visible; }
/* 供應鏈小卡（第三部分） */
.slide [hidden] { display: none !important; }
/* 每頁上方的浮水印 */
.slide .wm { position: absolute; top: 8px; left: 0; right: 0; text-align: center; font-size: 12px; color: var(--ink-3); opacity: .65; letter-spacing: .04em; pointer-events: none; z-index: 20; }

<div id="viewport"><div id="stage"></div></div>
<div id="progress"></div>
<div id="help">先點一下畫面 · ←/→ 翻頁 · N 講稿 · O 總覽 · B 跳回 · F 全螢幕</div>
<div id="hud"><button id="btn-prev" type="button" aria-label="上一頁">◀</button><span id="hud-num"></span><button id="btn-next" type="button" aria-label="下一頁">▶</button><button id="btn-notes" type="button">講稿</button><button id="btn-pv" type="button">講者視窗</button><button id="btn-ov" type="button">總覽</button></div>
<aside id="notes" hidden></aside>
<div id="overview" hidden></div>

<script>/* 簡報引擎：翻頁、縮放、講者備註、總覽、章節列
   每頁用 Deck.add({ id, part, title, minutes, render(h) -> html, init(el, ctx), notes }) 註冊 */
(function () {
  const W = 1600, H = 900;
  /* 第二部分的章節列：[章序, 名稱, 該章第一頁 id]；頁面用 chap: 1–5 指定所屬章節 */
  const CHAPS = [
    [1, '知識怎麼存', 'struct'], [2, '新增', 'modes'], [3, '修改與刪除', 'refs'], [4, '檢查與審核', 'gates'], [5, '新人怎麼學', 'learn']
  ];
  const PARTS = { 0: '開場', 1: '第一部分 · 為什麼、給誰', 2: '第二部分 · 怎麼運作', 3: '第三部分 · 跟 Git 主機結合', 4: '第四部分 · 怎麼開始', 5: '第五部分 · 現況', 9: '結尾' };

  const Deck = {
    slides: [],
    cur: -1,
    _rafs: [],
    add(s) { this.slides.push(s); },
    /* 檢查用：同步推進目前頁面的動畫 n 幀（背景分頁時瀏覽器會暫停動畫） */
    tick(n) { for (let k = 0; k < (n || 1); k++) { const t = performance.now() / 1000 + k * 0.05; this._rafs.forEach(f => f(0.05, t)); } },
    CHAPS, PARTS
  };
  window.Deck = Deck;

  /* ---------- 版面輔助 ---------- */
  function esc(s) { return String(s); }
  Deck.head = function (s, i) {
    let flow = '';
    if (s.chap) { // 右上角的章節列：亮起目前所在的章，點名稱跳到該章第一頁
      flow = '<div class="miniflow" aria-label="第二部分章節">' + CHAPS.map(([k, n, go]) =>
        `<span class="${k === s.chap ? 'on' : ''}" data-chap="${go}" title="跳到第 ${k} 章">${'①②③④⑤⑥⑦⑧⑨⑩'[k - 1]} ${n}</span>`).join('') + '</div>';
    }
    return `<header class="s-head">
      <div class="s-eyebrow"><span class="num">${String(i + 1).padStart(2, '0')}</span><span>${esc(s.eyebrow || PARTS[s.part] || '')}</span></div>
      ${flow}
      <h2 class="s-title">${s.title}${s.badge ? `<span class="newtag">${s.badge}</span>` : ''}${s.en ? `<span class="en">${s.en}</span>` : ''}</h2>
      ${s.thesis ? `<p class="s-thesis">${s.thesis}</p>` : ''}
    </header>`;
  };
  Deck.foot = function (s) {
    if (!s.src && !s.footL) return '';
    return `<footer class="s-foot"><span>${s.footL || ''}</span><span class="src">${s.src ? '資料：' + s.src : ''}</span></footer>`;
  };

  /* ---------- 舞台與縮放 ---------- */
  let stage, progress, hudNum, notesEl, overviewEl;
  let cleanups = [];
  let startTime = null;

  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const sc = Math.min(vw / W, vh / H);
    stage.style.transform = `translate(${-W * sc / 2}px, ${-H * sc / 2}px) scale(${sc})`;
    Deck.scale = sc;
  }

  /* 互動狀態：離頁前記下分頁鈕、逐步動畫、滑桿，按 B 回來或視窗縮放重建時還原（不用從第 1 步重來） */
  Deck._state = {};
  function snapState(el) {
    const st = { seg: [], step: [], rng: [] };
    el.querySelectorAll('.seg[id]').forEach(b => { const k = [...b.querySelectorAll('button')].findIndex(x => x.classList.contains('on')); if (k >= 0) st.seg.push([b.id, k]); });
    el.querySelectorAll('.stepper[id]').forEach(b => { const d = [...b.querySelectorAll('.dots i')]; const k = d.findIndex(x => x.classList.contains('on')); if (k >= 0) st.step.push([b.id, k]); });
    el.querySelectorAll('input[type=range][id]').forEach(r => st.rng.push([r.id, r.value]));
    return st;
  }
  function applyState(el, st) {
    const q = id => el.querySelector('#' + CSS.escape(id));
    st.seg.forEach(([id, k]) => { const b = q(id), bt = b && b.querySelectorAll('button')[k]; if (bt && !bt.classList.contains('on')) bt.click(); }); // 先切分頁（分頁會換掉下面的內容）
    st.rng.forEach(([id, v]) => { const r = q(id); if (r && r.value !== v) { r.value = v; r.dispatchEvent(new Event('input', { bubbles: true })); } });
    st.step.forEach(([id, k]) => { const b = q(id), d = b && b.querySelectorAll('.dots i')[k]; if (d && k > 0) d.click(); });
  }

  function runCleanups() {
    cleanups.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
    cleanups = [];
  }

  Deck.go = function (i, opts) {
    const n = Deck.slides.length;
    i = Math.max(0, Math.min(n - 1, i));
    if (i === Deck.cur && !(opts && opts.force)) return;
    const old = stage.querySelector('section.slide');
    if (old && Deck.slides[Deck.cur]) { try { Deck._state[Deck.slides[Deck.cur].id] = snapState(old); } catch (e) { console.error(e); } }
    runCleanups();
    Deck.cur = i; Deck._builtScale = Deck.scale;
    const s = Deck.slides[i];
    const el = document.createElement('section');
    el.className = 'slide enter ' + (s.cls || '');
    el.setAttribute('aria-label', `第 ${i + 1} 頁：${String(s.title).replace(/<[^>]+>/g, '')}`);
    try {
      el.innerHTML = s.raw ? s.render(i) : Deck.head(s, i) + s.render(i) + Deck.foot(s);
    } catch (e) { el.innerHTML = `<pre>${e.stack}</pre>`; console.error(e); }
    el.insertAdjacentHTML('beforeend', '<div class="wm">知識傳承框架 · 設計說明（10-24 定案，10-26 更新）· 對話與情境為示意</div>'); // 每頁上方的浮水印
    stage.innerHTML = '';
    stage.appendChild(el);
    backButton(el, s, opts);
    el.querySelectorAll('.miniflow [data-chap]').forEach(sp => { if (!sp.classList.contains('on')) sp.onclick = () => Deck.goId(sp.dataset.chap); });
    if (s.hub) { // 回到章節全貌頁（全貌頁會出現「回到第 N 頁」，可以來回跳）
      const t = Deck.slides.find(x => x.id === s.hub), eb = el.querySelector('.s-eyebrow');
      if (t && eb && Deck.slides[Deck._back] !== t) { const b = document.createElement('button'); b.type = 'button'; b.className = 'backbtn hubbtn'; b.textContent = '⌂ ' + String(t.hubShort || t.short || t.title).replace(/<[^>]+>/g, ''); b.onclick = () => Deck.goId(s.hub); eb.appendChild(b); }
    }
    if (s.init) {
      const ctx = {
        onCleanup(fn) { cleanups.push(fn); },
        raf(fn) { // 動畫迴圈，離頁自動停止
          let id, alive = true, last = performance.now();
          // 第一幀的 rAF 時間戳可能早於 performance.now()，dt 會是負的：夾在 0–0.05；單一幀出錯也不讓迴圈停掉
          const loop = t => { if (!alive) return; const dt = Math.max(0, Math.min(0.05, (t - last) / 1000)); last = t; try { fn(dt, t / 1000); } catch (e) { console.error('raf error', e); } id = requestAnimationFrame(loop); };
          id = requestAnimationFrame(loop);
          Deck._rafs.push(fn);
          const stop = () => { alive = false; cancelAnimationFrame(id); Deck._rafs = Deck._rafs.filter(f => f !== fn); };
          cleanups.push(stop); return stop;
        },
        timer(fn, ms) { const id = setInterval(fn, ms); cleanups.push(() => clearInterval(id)); return id; },
        timeout(fn, ms) { const id = setTimeout(fn, ms); cleanups.push(() => clearTimeout(id)); return id; }
      };
      try { s.init(el, ctx); } catch (e) { console.error('init error on slide', i + 1, e); }
      const keep = opts && (opts.returning || opts.keep) && Deck._state[s.id];
      if (keep) { try { applyState(el, keep); } catch (e) { console.error('restore error on slide', i + 1, e); } }
    }
    progress.style.width = ((i + 1) / n * 100) + '%';
    hudNum.textContent = `${i + 1} / ${n}`;
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { location.hash = String(i + 1); }
    renderNotes();
    renderPresenter();
    if (!overviewEl.hidden) renderOverview();
  };


  /* 跳頁連結：記住從哪一頁跳來，目標頁會出現「回到第 N 頁」按鈕（B 鍵也可以） */
  /* 調整頁序：把 id 那一頁搬到 afterId 那一頁後面 */
  Deck.move = function (id, afterId) {
    const i = Deck.slides.findIndex(s => s.id === id); if (i < 0) return;
    const [s] = Deck.slides.splice(i, 1);
    const j = Deck.slides.findIndex(x => x.id === afterId);
    Deck.slides.splice(j + 1, 0, s);
  };

  Deck.goId = function (id) {
    const i = Deck.slides.findIndex(s => s.id === id);
    if (i >= 0 && i !== Deck.cur) Deck.go(i, { from: Deck.cur });
  };
  Deck.goBack = function () { if (Deck._back != null) Deck.go(Deck._back, { returning: true }); };
  function backButton(el, s, opts) {
    let to = null;
    if (opts && opts.from != null) to = opts.from;
    else if (s.back) to = Deck.slides.findIndex(x => x.id === s.back);
    Deck._back = to != null && to >= 0 ? to : null;
    if (Deck._back == null) return;
    const t = Deck.slides[Deck._back];
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'backbtn';
    b.innerHTML = `↩ 回到第 ${Deck._back + 1} 頁：${String(t.short || t.title).replace(/<[^>]+>/g, '')}`;
    b.onclick = Deck.goBack;
    const eb = el.querySelector('.s-eyebrow');
    if (eb) eb.appendChild(b); else { b.classList.add('float'); el.appendChild(b); }
  }

  function cumMinutes(upto) {
    let m = 0; for (let k = 0; k < upto; k++) m += Deck.slides[k].minutes || 0; return m;
  }
  // 計時基準：按 T 時記下目前頁，計畫進度從這一頁起算（第二場從中間開講時才不會顯示超前一大截）
  let planBase = 0;
  const planAt = i => cumMinutes(i) - cumMinutes(planBase);
  // 講稿段落開頭的【可略】【提示】標籤換顏色，講者一眼看得到
  const notesHTML = s => (s.notes || '（本頁沒有講稿）').trim().split(/\n\s*\n/).map(p => `<p>${p.trim().replace(/^【(.+?)】/, '<b class="tg">【$1】</b>')}</p>`).join('');
  function fmtMin(m) { return `${Math.floor(m)}:${String(Math.round((m % 1) * 60)).padStart(2, '0')}`; }

  function renderNotes() {
    if (notesEl.hidden) return;
    const s = Deck.slides[Deck.cur];
    const total = planAt(Deck.slides.length);
    const el = startTime ? (Date.now() - startTime) / 60000 : 0;
    const paras = notesHTML(s);
    notesEl.innerHTML = `<div class="nh"><span>講稿 · 第 ${Deck.cur + 1} 頁 · 建議 <b>${s.minutes || 0} 分</b></span>
      <span>計畫進度 ${fmtMin(Math.max(0, planAt(Deck.cur)))} → ${fmtMin(Math.max(0, planAt(Deck.cur + 1)))} / ${planBase ? '本場（從第 ' + (planBase + 1) + ' 頁起）' : '全場'} ${fmtMin(total)}</span>
      <span>實際經過 <b id="elapsed">${fmtMin(el)}</b>（按 T 重設計時）</span></div>${paras}`;
  }

  /* 講者視窗：另開一個視窗顯示備註、下一頁與計時（投影時主畫面維持乾淨） */
  let presenter = null;
  function openPresenter() {
    try { presenter = window.open('', 'deck-presenter', 'width=900,height=640'); } catch (e) { presenter = null; }
    if (!presenter) { notesEl.hidden = false; renderNotes(); return; }
    const d = presenter.document;
    d.open();
    d.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>講者視窗</title><style>
      body{margin:0;font-family:"PingFang TC","Noto Sans TC",system-ui,sans-serif;background:#1b2430;color:#e9eef4}
      header{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;background:#111822;gap:16px;flex-wrap:wrap}
      .big{font-size:40px;font-family:Menlo,monospace;color:#ffd28a}.cur{font-size:22px;font-weight:700}.nx{color:#9fb0c4;font-size:16px}
      main{padding:18px 26px;font-size:21px;line-height:1.75}main p{margin:0 0 12px}
      button{font:inherit;font-size:18px;padding:8px 18px;border-radius:4px;border:1px solid #4a5a70;background:#26344a;color:#fff;cursor:pointer}
      .bar{height:6px;background:#26344a}.bar i{display:block;height:100%;background:#1f4fb5}.tg{color:#ffd28a}
    </style></head><body><header><div><div class="cur" id="pc"></div><div class="nx" id="pn"></div></div>
      <div><span class="big" id="pt"></span> <span class="nx" id="pp"></span></div>
      <div><button id="bp">◀ 上一頁</button> <button id="bn">下一頁 ▶</button></div></header>
      <div class="bar"><i id="pb"></i></div><main id="pm"></main></body></html>`);
    d.close();
    d.getElementById('bp').onclick = () => Deck.go(Deck.cur - 1);
    d.getElementById('bn').onclick = () => Deck.go(Deck.cur + 1);
    d.addEventListener('keydown', e => {
      if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { Deck.go(Deck.cur + 1); e.preventDefault(); }
      if (['ArrowLeft', 'PageUp'].includes(e.key)) { Deck.go(Deck.cur - 1); e.preventDefault(); }
    });
    renderPresenter();
  }
  function renderPresenter() {
    if (!presenter || presenter.closed) return;
    const d = presenter.document, s = Deck.slides[Deck.cur], nx = Deck.slides[Deck.cur + 1];
    const strip = x => String(x || '').replace(/<[^>]+>/g, '');
    const el = startTime ? (Date.now() - startTime) / 60000 : 0, plan = Math.max(0, planAt(Deck.cur));
    const q = id => d.getElementById(id);
    if (!q('pc')) return;
    q('pc').textContent = `${Deck.cur + 1} / ${Deck.slides.length}　${strip(s.title)}（建議 ${s.minutes || 0} 分）`;
    q('pn').textContent = nx ? '下一頁：' + strip(nx.short || nx.title) : '最後一頁';
    q('pt').textContent = fmtMin(el);
    const diff = el - plan;
    q('pp').textContent = `計畫 ${fmtMin(plan)}　${diff > 1 ? '落後 ' + fmtMin(diff) : diff < -1 ? '超前 ' + fmtMin(-diff) : '準時'}`;
    q('pb').style.width = ((Deck.cur + 1) / Deck.slides.length * 100) + '%';
    q('pm').innerHTML = notesHTML(s);
  }
  Deck.openPresenter = openPresenter;

  function renderOverview() {
    const total = cumMinutes(Deck.slides.length);
    let html = `<div class="ot">全場 ${Deck.slides.length} 頁 · 預估 ${fmtMin(total)} · 點擊跳頁 · Esc 關閉</div>`;
    let part = null;
    Deck.slides.forEach((s, i) => {
      if (s.part !== part) {
        if (part !== null) html += '</div>';
        part = s.part;
        const pm = Deck.slides.filter(x => x.part === part).reduce((a, x) => a + (x.minutes || 0), 0);
        html += `<h3>${PARTS[part]} · ${fmtMin(pm)}</h3><div class="og">`;
      }
      html += `<div class="oc ${i === Deck.cur ? 'cur' : ''}" data-i="${i}"><span class="i">${i + 1}</span><span>${String(s.short || s.title).replace(/<[^>]+>/g, '')}</span><span class="m">${s.minutes || 0}′</span></div>`;
    });
    html += '</div>';
    overviewEl.innerHTML = html;
  }

  function toggle(el, force) {
    el.hidden = force === undefined ? !el.hidden : !force;
  }

  Deck.start = function () {
    stage = document.getElementById('stage');
    progress = document.getElementById('progress');
    hudNum = document.getElementById('hud-num');
    notesEl = document.getElementById('notes');
    overviewEl = document.getElementById('overview');
    fit();
    // 視窗大小改變（例如按 F 全螢幕）：canvas 解析度是進頁時決定的，縮放差超過一成就重建當頁，避免畫面變糊
    let rsT = null;
    window.addEventListener('resize', () => {
      fit(); clearTimeout(rsT);
      rsT = setTimeout(() => { if (Math.abs(Deck.scale / (Deck._builtScale || Deck.scale) - 1) > 0.1) { Deck.go(Deck.cur, { force: true, from: Deck._back, keep: true }); } }, 300);
    });

    document.addEventListener('keydown', e => {
      const t = e.target;
      const isRange = t && t.tagName === 'INPUT' && t.type === 'range';
      const typing = t && !isRange && (t.tagName === 'INPUT' || t.tagName === 'SELECT' || t.tagName === 'TEXTAREA');
      if (typing && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) return;
      // 滑桿：上下鍵調整數值，左右鍵照常翻頁（講者拖完滑桿直接按 → 就能換頁）
      if (isRange && ['ArrowUp', 'ArrowDown'].includes(e.key)) return;
      if (isRange && ['ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', ' '].includes(e.key)) t.blur();
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      switch (e.key) {
        case 'ArrowRight': case 'PageDown': case ' ': Deck.go(Deck.cur + 1); e.preventDefault(); break;
        case 'ArrowLeft': case 'PageUp': Deck.go(Deck.cur - 1); e.preventDefault(); break;
        case 'Home': Deck.go(0); break;
        case 'End': Deck.go(Deck.slides.length - 1); break;
        case 'n': case 'N': toggle(notesEl); renderNotes(); break;
        case 'o': case 'O': toggle(overviewEl); if (!overviewEl.hidden) renderOverview(); break;
        case 'Escape': toggle(overviewEl, false); break;
        case 't': case 'T': startTime = Date.now(); planBase = Deck.cur; renderNotes(); renderPresenter(); break;
        case 'p': case 'P': openPresenter(); break;
        case 'b': case 'B': Deck.goBack(); break;
        case 'f': case 'F':
          if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {});
          else document.exitFullscreen?.();
          break;
      }
    });
    // 全螢幕時的醒目游標：紅色光暈跟著滑鼠，點擊有波紋；停 3 秒淡出；L 鍵開關
    const ptr = document.createElement('div'); ptr.id = 'ptr-halo'; document.body.appendChild(ptr);
    let ptrOn = true, ptrIdle = null;
    const ptrShow = () => { ptr.classList.toggle('on', ptrOn && !!document.fullscreenElement); };
    document.addEventListener('mousemove', e => {
      ptr.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
      ptrShow(); ptr.classList.remove('idle');
      clearTimeout(ptrIdle); ptrIdle = setTimeout(() => ptr.classList.add('idle'), 3000);
    }, { passive: true });
    document.addEventListener('mousedown', e => {
      if (!ptrOn || !document.fullscreenElement) return;
      const r = document.createElement('div'); r.className = 'ptr-ripple';
      r.style.left = e.clientX + 'px'; r.style.top = e.clientY + 'px';
      document.body.appendChild(r); setTimeout(() => r.remove(), 650);
    });
    document.addEventListener('fullscreenchange', ptrShow);
    document.addEventListener('keydown', e => {
      if ((e.key === 'l' || e.key === 'L') && !e.metaKey && !e.ctrlKey && !e.altKey && !(e.target && e.target.tagName === 'INPUT' && e.target.type !== 'range')) { ptrOn = !ptrOn; ptrShow(); }
    });

    overviewEl.addEventListener('click', e => {
      const c = e.target.closest('.oc'); if (!c) return;
      toggle(overviewEl, false); Deck.go(+c.dataset.i);
    });
    document.getElementById('btn-prev').onclick = () => Deck.go(Deck.cur - 1);
    document.getElementById('btn-next').onclick = () => Deck.go(Deck.cur + 1);
    document.getElementById('btn-notes').onclick = () => { toggle(notesEl); renderNotes(); };
    document.getElementById('btn-ov').onclick = () => { toggle(overviewEl); if (!overviewEl.hidden) renderOverview(); };

    // 觸控滑動
    let tx = null;
    document.addEventListener('touchstart', e => { if (e.target.tagName !== 'INPUT') tx = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', e => {
      if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; tx = null;
      if (Math.abs(dx) > 60) Deck.go(Deck.cur + (dx < 0 ? 1 : -1));
    });

    setInterval(() => { const e = document.getElementById('elapsed'); if (e && startTime) e.textContent = fmtMin((Date.now() - startTime) / 60000); renderPresenter(); }, 1000);
    const bpv = document.getElementById('btn-pv'); if (bpv) bpv.onclick = openPresenter;
    startTime = Date.now();
    const h = parseInt((location.hash || '').replace('#', ''), 10);
    Deck.go(isNaN(h) ? 0 : h - 1, { force: true });
  };
})();
</script>
<script>/* 共用互動元件輔助函式 */
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const U = {};
  window.U = U;

  U.$ = (el, sel) => el.querySelector(sel);
  U.$$ = (el, sel) => Array.from(el.querySelectorAll(sel));
  U.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  U.lerp = (a, b, t) => a + (b - a) * t;
  U.ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

  /* 材料顏色（和 CSS 變數同步） */
  const MAT = {
    si: '#a9bcd0', siDark: '#7f97b0', ox: '#f1e3a8', nit: '#8fc1b5', pr: '#e39ac2', prExp: '#f6d3e6',
    poly: '#c2a878', hk: '#9d80d6', metal: '#7b8794', cu: '#c9793b', sige: '#b8c85a', n: '#5b8fd9', p: '#d9765b',
    w: '#5e6770', ru: '#6f86a8', mask: '#2b3440', air: '#ffffff', lowk: '#d9e7c4', tin: '#6e5f4b', bond: '#c8cdd4',
    accent: '#1f4fb5', accent2: '#b3541e', ink: '#17202b', ink2: '#3e4b5b', ink3: '#6a7888', line: '#d3dbe4', good: '#1f7a4d', bad: '#b3261e', warn: '#a8660a'
  };
  U.MAT = MAT;
  /* 粒子顏色（全場統一）：電子＝藍色實心、電洞＝紅色空心、出問題的電子（漏電、穿隧）＝藍點加紅框 */
  U.PC = { e: '#1f4fb5', h: '#c0392b', bad: '#b3261e' };
  U.electron = (c, x, y, r, bad) => {
    c.fillStyle = U.PC.e; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    if (bad) { c.strokeStyle = U.PC.bad; c.lineWidth = 1.8; c.beginPath(); c.arc(x, y, r + 1.6, 0, 7); c.stroke(); }
  };
  U.hole = (c, x, y, r) => { c.fillStyle = '#fff'; c.strokeStyle = U.PC.h; c.lineWidth = 2; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); c.stroke(); };
  /* 圖角的小圖例：kinds 取自 'e'（電子）、'h'（電洞）、'bad'（漏電的電子） */
  U.pLegend = (c, x, y, kinds) => {
    const lab = { e: '電子', h: '電洞', bad: '漏電／穿隧的電子' }, w0 = kinds.reduce((a, k) => a + 26 + lab[k].length * 14, 0) + 10;
    c.fillStyle = 'rgba(255,255,255,.92)'; c.fillRect(x, y, w0, 24); c.strokeStyle = '#d3dbe4'; c.lineWidth = 1; c.strokeRect(x + .5, y + .5, w0 - 1, 23);
    let xx = x + 12;
    kinds.forEach(k => {
      if (k === 'h') U.hole(c, xx, y + 12, 4.5); else U.electron(c, xx, y + 12, 4.5, k === 'bad');
      c.font = '500 13px "PingFang TC","Noto Sans TC",sans-serif'; c.fillStyle = '#3e4b5b'; c.textBaseline = 'middle'; c.fillText(lab[k], xx + 9, y + 13); c.textBaseline = 'alphabetic';
      xx += 26 + lab[k].length * 14;
    });
  };
  U.MAT_NAME = {
    si: '矽 Si', ox: '氧化矽 SiO₂', nit: '氮化矽 SiN', pr: '光阻 PR', prExp: '已曝光光阻', poly: '多晶矽 Poly-Si', hk: '高介電 HfO₂',
    metal: '金屬閘極', cu: '銅 Cu', sige: '矽鍺 SiGe', n: 'n 型摻雜區', p: 'p 型摻雜區', w: '鎢 W', ru: '釕 Ru', mask: '光罩鉻層', lowk: 'low-k 介電', tin: '阻障層（TaN/Ta）'
  };

  /* ---------- SVG ---------- */
  U.svg = function (tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) {
      if (k === 'text') e.textContent = attrs[k];
      else if (attrs[k] !== undefined && attrs[k] !== null) e.setAttribute(k, attrs[k]);
    }
    if (tag === 'text' && attrs && attrs.fill) e.style.fill = attrs.fill;
    if (parent) parent.appendChild(e);
    return e;
  };
  /* 讓 SVG 的 viewBox 等於實際像素大小（舞台固定 1600×900，clientWidth 不受縮放影響） */
  U.fit = function (svg) {
    const r = svg.parentElement;
    const w = r.clientWidth || 600, h = r.clientHeight || 400;
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    return { w, h };
  };
  U.clear = el => { while (el.firstChild) el.removeChild(el.firstChild); };

  U.lin = (d0, d1, r0, r1) => { const f = v => r0 + (v - d0) / (d1 - d0) * (r1 - r0); f.inv = p => d0 + (p - r0) / (r1 - r0) * (d1 - d0); return f; };
  U.log = (d0, d1, r0, r1) => { const a = Math.log10(d0), b = Math.log10(d1); const f = v => r0 + (Math.log10(Math.max(v, 1e-300)) - a) / (b - a) * (r1 - r0); return f; };
  U.pathD = pts => pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');

  /* 座標軸：回傳 {x, y, g, plot} */
  U.axes = function (svg, o) {
    const { w, h } = o.size || U.fit(svg);
    const m = Object.assign({ l: 62, r: 16, t: 14, b: 46 }, o.m || {});
    const X = (o.xlog ? U.log : U.lin)(o.x[0], o.x[1], m.l, w - m.r);
    const Y = (o.ylog ? U.log : U.lin)(o.y[0], o.y[1], h - m.b, m.t);
    const g = U.svg('g', {}, svg);
    const grid = U.svg('g', { class: 'grid' }, g);
    const ax = U.svg('g', { class: 'axis' }, g);
    const xt = o.xticks || [], yt = o.yticks || [];
    xt.forEach(v => {
      const px = X(v);
      U.svg('line', { x1: px, x2: px, y1: m.t, y2: h - m.b }, grid);
      U.svg('text', { x: px, y: h - m.b + 18, 'text-anchor': 'middle', class: 'lbl-s mono', text: o.fx ? o.fx(v) : v }, ax);
    });
    yt.forEach(v => {
      const py = Y(v);
      U.svg('line', { x1: m.l, x2: w - m.r, y1: py, y2: py }, grid);
      U.svg('text', { x: m.l - 7, y: py + 4, 'text-anchor': 'end', class: 'lbl-s mono', text: o.fy ? o.fy(v) : v }, ax);
    });
    U.svg('line', { x1: m.l, x2: w - m.r, y1: h - m.b, y2: h - m.b }, ax);
    U.svg('line', { x1: m.l, x2: m.l, y1: m.t, y2: h - m.b }, ax);
    if (o.xlabel) U.svg('text', { x: (m.l + w - m.r) / 2, y: h - 8, 'text-anchor': 'middle', class: 'lbl', text: o.xlabel }, ax);
    if (o.ylabel) U.svg('text', { x: 16, y: (m.t + h - m.b) / 2, 'text-anchor': 'middle', class: 'lbl', transform: `rotate(-90 16 ${(m.t + h - m.b) / 2})`, text: o.ylabel }, ax);
    const plot = U.svg('g', {}, svg);
    return { x: X, y: Y, g, plot, w, h, m };
  };

  /* ---------- 控制元件 HTML ---------- */
  U.range = (id, label, min, max, step, val, unit) =>
    `<div class="ctl"><label for="${id}">${label}<output id="${id}-o"></output></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" data-unit="${unit || ''}"></div>`;
  /* 綁定滑桿；fmt 可自訂顯示 */
  U.bind = function (el, id, fn, fmt) {
    const inp = U.$(el, '#' + id), out = U.$(el, '#' + id + '-o');
    const upd = () => { const v = parseFloat(inp.value); out.textContent = fmt ? fmt(v) : v + (inp.dataset.unit || ''); fn && fn(v); };
    inp.addEventListener('input', upd);
    upd();
    return { get: () => parseFloat(inp.value), set: v => { inp.value = v; upd(); }, el: inp, refresh: upd };
  };
  U.seg = (id, items, on = 0) =>
    `<div class="seg" id="${id}" role="group">${items.map((t, i) => `<button type="button" data-i="${i}" class="${i === on ? 'on' : ''}">${t}</button>`).join('')}</div>`;
  U.onSeg = function (el, id, fn) {
    const box = U.$(el, '#' + id);
    const set = i => { U.$$(box, 'button').forEach((b, k) => b.classList.toggle('on', k === i)); fn(i); };
    box.addEventListener('click', e => { const b = e.target.closest('button'); if (b) set(+b.dataset.i); });
    const cur = U.$$(box, 'button').findIndex(b => b.classList.contains('on'));
    fn(cur < 0 ? 0 : cur);
    return { set };
  };

  /* ---------- 逐步播放器 ----------
     host 內需有 .stepper 容器與 .step-text；steps = [{t:'標題', d:'說明'}]；draw(i) 繪製第 i 步 */
  U.stepperHTML = (id) => `<div class="stepper" id="${id}"><button class="btn" data-a="prev" type="button">◀ 上一步</button><button class="btn primary" data-a="next" type="button">下一步 ▶</button><button class="btn" data-a="play" type="button">▶ 自動播放</button><span class="dots"></span></div><div class="step-text" id="${id}-t"></div>`;
  U.stepper = function (el, id, steps, draw, ctx, opts) {
    const box = U.$(el, '#' + id), txt = U.$(el, '#' + id + '-t');
    const dots = U.$(box, '.dots');
    dots.innerHTML = steps.map((_, i) => `<i data-i="${i}" title="${steps[i].t}"></i>`).join('');
    let i = 0, playing = null;
    const show = k => {
      i = U.clamp(k, 0, steps.length - 1);
      U.$$(dots, 'i').forEach((d, j) => { d.className = j === i ? 'on' : j < i ? 'done' : ''; });
      txt.innerHTML = `<b>${i + 1}. ${steps[i].t}</b>　${steps[i].d || ''}`;
      draw(i);
    };
    const stop = () => { if (playing) { clearInterval(playing); playing = null; U.$(box, '[data-a=play]').textContent = '▶ 自動播放'; } };
    box.addEventListener('click', e => {
      const b = e.target.closest('[data-a]'), d = e.target.closest('i[data-i]');
      if (d) { stop(); show(+d.dataset.i); return; }
      if (!b) return;
      if (b.dataset.a === 'prev') { stop(); show(i - 1); }
      if (b.dataset.a === 'next') { stop(); show(i + 1); }
      if (b.dataset.a === 'play') {
        if (playing) { stop(); return; }
        if (i >= steps.length - 1) show(0);
        b.textContent = '❚❚ 暫停';
        playing = setInterval(() => { if (i >= steps.length - 1) stop(); else show(i + 1); }, (opts && opts.interval) || 1800);
      }
    });
    ctx && ctx.onCleanup(stop);
    show((opts && opts.start) || 0);
    return { show, get: () => i };
  };

  /* ---------- Canvas ---------- */
  U.canvas = function (cv) {
    const r = cv.parentElement;
    const w = r.clientWidth || 600, h = r.clientHeight || 400, dpr = Math.min(2, window.devicePixelRatio || 1) * Math.max(1, (window.Deck && Deck.scale) || 1);
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);

  };

  /* ---------- 剖面繪圖：以材料矩形與多邊形描述狀態 ----------
     shapes: [{m:'si', x,y,w,h} | {m, pts:[[x,y],...]} | {label:'文字', x,y, anchor}] */
  U.drawShapes = function (g, shapes) {
    U.clear(g);
    shapes.forEach(s => {
      if (!s) return;
      if (s.label !== undefined) {

      }

      const fill = MAT[s.m] || s.m;
      const common = { fill, stroke: s.stroke || 'rgba(20,30,45,.35)', 'stroke-width': s.sw || .8, opacity: s.op, class: s.cls };
      if (s.pts) U.svg('polygon', Object.assign({ points: s.pts.map(p => p.join(',')).join(' ') }, common), g);
      else if (s.r) U.svg('circle', Object.assign({ cx: s.x, cy: s.y, r: s.r }, common), g);
      else U.svg('rect', Object.assign({ x: s.x, y: s.y, width: Math.max(0, s.w), height: Math.max(0, s.h), rx: s.rx || 0 }, common), g);
    });
  };
  U.arrowDefs = function (svg, color) {
    const d = U.svg('defs', {}, svg);
    const mk = U.svg('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse' }, d);
    U.svg('path', { d: 'M0,0 L10,5 L0,10 z', fill: color || MAT.ink2 }, mk);
    return d;
  };
  U.legendHTML = keys => `<div class="legend">${keys.map(k => `<span><i style="background:${MAT[k]}"></i>${U.MAT_NAME[k] || k}</span>`).join('')}</div>`;

  U.fmt = (v, d = 1) => Number(v).toFixed(d);
  U.sci = v => { if (v === 0) return '0'; const e = Math.floor(Math.log10(Math.abs(v))); const m = v / Math.pow(10, e); return `${m.toFixed(1)}×10${U.sup(e)}`; };

  U.gauss = (x, mu, s) => Math.exp(-((x - mu) ** 2) / (2 * s * s));
})();

    },

<script>/* 第一部分：為什麼、給誰 */
(function () {

  /* 知識只在人腦袋裡：切換「沒有框架／有框架」，拖時間看老手調走之後新人還拿不拿得到 */
  A({

    init(el, ctx) {

      const S = [w * .15, h * .42], H = [w * .5, h * .42], NW = [[w * .85, h * .17], [w * .85, h * .45], [w * .85, h * .73]];

        U.txt(c, lab, p[0], p[1] + 50, { align: 'center', size: 15, w: 600, color: '#3e4b5b' });
      };
      ctx.raf((dt, t) => {
        c.clearRect(0, 0, w, h);
        const gone = tt >= .5, sA = gone ? Math.max(.12, 1 - (tt - .5) * 5) : 1;
        if (mode) {
          c.fillStyle = '#e3ebfa'; c.strokeStyle = '#1f4fb5'; c.lineWidth = 2;

        } else {

            c.fillStyle = '#fff'; c.strokeStyle = '#9aa8b8'; c.lineWidth = 1.2; c.fillRect(-26, -18, 52, 36); c.strokeRect(-26, -18, 52, 36);
            c.strokeStyle = '#d3dbe4'; c.beginPath(); c.moveTo(-18, -6); c.lineTo(18, -6); c.moveTo(-18, 4); c.lineTo(10, 4); c.stroke(); c.restore();

      });
    },
    notes: `左邊預設是「沒有框架」：知識繞在老手身上，旁邊是散落的筆記和舊簡報。把時間往右拖，過了一半老手調走，老手身上的知識跟著消失；筆記還在，但沒人知道放在哪、哪份才對。

【提示】數字和互動元件都是示意，重點是把知識從人身上搬到有版本紀錄的地方。`
  });

  const ROLES = [

    { n: '傳承者', does: ['開工時看待回答、勘誤和可以補出處的簡報頁，認領要做的', '用研究、整理、訪談新增知識：做成簡報頁，一頁放不下再接深入頁', '修改、刪除或合併簡報頁和深入頁', '維護者留意見時，請 Agent 照意見改'], say: ['有什麼我可以做的？', '我來回答 #12', '幫我研究 High-NA EUV，放進微影那章'], cmd: '/kb-add、/kb-change、/kb-new' },

  ];
  A({

    title: '四種角色：依你當下在做的事來分', en: 'Roles',

          U.rrect(c, px - W / 2, py - H / 2, W, H, 8); c.stroke();
          U.txt(c, t1, px, py - 2, { align: 'center', size: 16, w: 700, color: '#17202b' });
          U.txt(c, t2, px, py + 16, { align: 'center', size: 12.5, color: '#6a7888' });
          c.globalAlpha = 1;
        });
        // 線上的說明（只在單一流程時顯示）
        if (cur) FLOWS[cur - 1].labels.forEach(([a, b, s]) => { const pa = P(a), pb = P(b); U.txt(c, s, (pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2 - 8, { align: 'center', size: 14, w: 700, color: FLOWS[cur - 1].col, bg: 'rgba(255,255,255,.95)' }); });
        if (!cur) U.txt(c, '框架維護者管規則、引擎和新知識庫；維護者管各知識庫的內容', w / 2, h - 6, { align: 'center', size: 13, color: '#6a7888' });
      });
    },
    notes: `這一頁是給主管的總覽，先把整件事一次講完，後面各頁再展開細節。我們要解決的問題是：經驗只在老手的腦袋、個人筆記和舊簡報裡，人一調走就沒了，新人也不知道從哪裡看起、該問誰。做法是讓 Agent 把經驗寫成互動簡報，一頁講一個概念，放不下的長說明接在後面的深入頁；每一次修改都經過檢查和維護者審核，全部記在一個 Git repo 裡。新人從入口網站開始，先看全景圖和每章的速覽。

左邊的圖有四條流程，按「下一步」逐一看。寫進去：老手用說的，Agent 做成簡報頁、開變更提案，維護者核准後併入正式內容。發出去：CI 自動建置簡報、和入口網站一起打包，新人下載解開就能看。學出來：新人看不懂就問 Agent，答案根據簡報、一定附出處頁。問回來：簡報沒寫的問題變成 issue，回到老手手上，答完自動關閉。

右邊分頁說明好處、需要什麼、風險和現況。需要的資源很少：一個 Git repo、會用 Claude Code 的同仁、每個知識庫一位維護者，不用架伺服器。

現況：20 個變更提案已經合併，入口網站、半導體 90 頁簡報和 28 頁深入頁、電腦視覺的簡報骨架、情境測試都在正式內容上。10-26 起拿掉手冊，只留簡報。之後是慢慢補的工作，例如 44 頁補出處。需要的支持是確定 Git 主機和帳號，以及指定各知識庫的維護者。`
  });
